name: Engineering checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.lock
      - run: python -m pip install --require-hashes -r requirements.lock
      - run: python -m pytest -q
      - run: python scripts/run_engineering_samples.py
      - run: python -m compileall -q backend/app frontend tests
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm audit --audit-level=high
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.lock
      - run: python -m pip install --require-hashes -r ../requirements.lock
      - name: Reproduce the teacher and student simulator demo
        run: |
          CHROME="$(command -v google-chrome)" python e2e/demo.py "$RUNNER_TEMP/patient-demo"
          jq -e '.isolated_data and .temporary_data_removed and .real_model_calls == 0 and .checks_passed == 13 and .checks_total == 13' "$RUNNER_TEMP/patient-demo/isolation.json"

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - run: python -m pip install pip-audit
      - run: python -m pip_audit --strict --require-hashes -r requirements.lock
